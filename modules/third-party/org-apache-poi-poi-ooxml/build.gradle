import com.liferay.gradle.plugins.patcher.PatchTask

apply plugin: "com.liferay.patcher"

task deployJar(type: Copy)
task jarManifest
task jarPatched(type: Zip)
task patch(type: PatchTask)

dependencies {
	compileOnly group: "org.apache.poi", name: "poi-ooxml", version: "5.2.2"
	compileOnly group: 'org.apache.commons', name: 'commons-compress', version: '1.21'
	compileOnly group: 'org.apache.logging.log4j', name: 'log4j-api', version: '2.17.2'
}

deploy {
	finalizedBy deployJar
}

deployJar {
	ext {
		autoClean = false
	}

	from jar
	into "../../../lib/portal"

	rename {
		"poi-ooxml.jar"
	}
}

jar {
	setActions([])

	dependsOn jarPatched
}

jarManifest {
	doLast {
		ant.jar(destfile: jar.archivePath, update: true)
	}
}

jarPatched {
	archiveName = jar.archiveName
	destinationDir = jar.destinationDir
	duplicatesStrategy = "exclude"
	exclude "META-INF/versions/9/module-info.class"
	from copyPatchOriginalLibClasses
}

javadoc {
	enabled = false
}

patch {
	ext {
		autoClean = false
	}

	fileNames "org/apache/poi/openxml4j/util/ZipSecureFile.java"

	originalLibModuleName = "poi-ooxml"
}