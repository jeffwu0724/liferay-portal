import com.liferay.gradle.plugins.patcher.PatchTask
import com.liferay.gradle.util.FileUtil
import com.liferay.gradle.util.OSDetector

import groovy.io.FileType

apply plugin: "com.liferay.patcher"

task deleteSrcDirectory(type: Delete)
task downloadSrc(type: Exec)
task jarManifest
task unzip(type: Copy)

String srcUrl = "https://github.com/DaisyDiff/DaisyDiff/archive/refs/heads/master.zip"
String tempDir ="build/tmp/zip"

compileJava {
	dependsOn downloadSrc
	dependsOn unzip
}

deleteSrcDirectory {

}

dependencies {
	compileOnly group: "net.sourceforge.htmlunit", name: "neko-htmlunit", transitive: false, version: "2.66.0"
	compileOnly group: "org.eclipse.core", name: "runtime", transitive: false, version: "20070801"
	compileOnly group: "xerces", name: "xercesImpl", transitive: false, version: "2.12.1"
}

downloadSrc {
	File srcTmpDir = new File(temporaryDir, "src")

	if (OSDetector.windows) {
		executable "cmd.exe"

		args "/c"
	}
	else {
		executable "/bin/sh"

		args "-c"
	}

	args "wget '${srcUrl}' -P '${tempDir}'"
}

jar {
	dependsOn downloadSrc
	dependsOn unzip
	dependsOn compileJava
//	finalizedBy jarManifest
//	finalizedBy deleteSrcDirectory
	setActions([])
}

unzip {
	dependsOn downloadSrc

	doLast {
		File srcTmpDir = new File("${tempDir}/src/DaisyDiff-master/src/main/java/org")

		srcTmpDir.eachFileRecurse(FileType.FILES) {
			if (it.name == "CleanBrokenAttributeQNamesHandler.java" ||
				it.name == "NekoHtmlParser.java") {

				return
			}

			if (it.name.endsWith(".java")) {
				File destFile = new File(file("src/main/java"), FileUtil.relativize(it, srcTmpDir))

				destFile.parentFile.mkdirs()

				it.renameTo(destFile)
			}
		}
	}

	ext {
		autoClean = false
	}

	from zipTree(file("${tempDir}/master.zip"))
	into file("${tempDir}/src")
}