import com.liferay.gradle.plugins.patcher.PatchTask

apply plugin: "com.liferay.patcher"

task deployJar(type: Copy)
task jarManifest
task jarPatched(type: Zip)
task patch(type: PatchTask)

dependencies {
	compileOnly group: "org.apache.commons", name: "commons-configuration2", transitive: false, version: "2.12.0"
}

jar {
	dependsOn jarPatched
	finalizedBy jarManifest
	setActions([])
}

jarPatched {
	archiveFileName = jar.archiveFileName
	destinationDirectory = jar.destinationDirectory
	duplicatesStrategy = "exclude"
	exclude "module-info.class"
	from sourceSets.main.output

	from {
		zipTree(configurations.compileOnly.singleFile)
	}

	mustRunAfter compileJava
	mustRunAfter generatePomFileForMavenPublication
	mustRunAfter processResources
}

jarSources {
	mustRunAfter patch
}

patch {
	ext {
		autoClean = false
	}

	fileNames "org/apache/commons/configuration2/PropertiesConfiguration.java"
	originalLibModuleName = "commons-configuration2"
}