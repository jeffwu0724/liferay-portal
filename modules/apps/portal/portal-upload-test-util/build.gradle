dependencies {
	compileOnly group: "net.bytebuddy", name: "byte-buddy", version: "1.12.9"
	compileInclude group: "org.mockito", name: "mockito-core", version: "4.5.1"

	compileOnly group: "com.liferay.portal", name: "com.liferay.portal.impl", version: "default"
	compileOnly group: "com.liferay.portal", name: "com.liferay.portal.kernel", version: "default"
	compileOnly group: "com.liferay.portal", name: "com.liferay.portal.test", version: "default"
	compileOnly group: "com.liferay.portletmvc4spring", name: "com.liferay.portletmvc4spring.test", version: "5.2.1"
	compileOnly group: "javax.portlet", name: "portlet-api", version: "3.0.1"
	compileOnly group: "junit", name: "junit", version: "4.13.1"
	compileOnly group: "org.apache.felix", name: "org.apache.felix.http.servlet-api", version: "1.1.2"
	compileOnly project(":apps:portal:portal-upload-api")

	testIntegrationCompile group: "net.bytebuddy", name: "byte-buddy-agent", version: "1.12.9"
	testIntegrationCompile group: "org.objenesis", name: "objenesis", version: "3.2"
}

liferay {
	deployDir = file("${liferayHome}/osgi/test")
}